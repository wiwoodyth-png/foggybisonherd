<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>FoggyBisonHerd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12181A;
    --cream:#F7F2E2;
    --line: rgba(18,24,26,0.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter', sans-serif;
    color:var(--ink);
    min-height:100vh;
    background:#0B8C84;
    transition:background 0.25s ease;
  }
  body.day-Friday{ background:#0B8C84; }
  body.day-Saturday{ background:#F26B3A; }
  body.day-Sunday{ background:#4C9A2A; }

  .wrap{max-width:1180px;margin:0 auto;padding:16px 14px 60px;}

  .header{
    display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
    flex-wrap:wrap;margin-bottom:12px;
  }
  .title-block h1{
    font-family:'Anton', sans-serif;font-weight:400;letter-spacing:0.5px;
    font-size:clamp(24px, 5.4vw, 38px);color:#FFD23E;
    text-shadow: 3px 3px 0 var(--ink);
    margin:0;line-height:0.95;
  }
  .title-block .sub{
    font-family:'Space Mono', monospace;color:var(--cream);
    font-size:12px;margin-top:6px;opacity:0.92;letter-spacing:0.4px;
  }

  /* day tabs */
  .day-tabs{display:flex;gap:8px;margin-bottom:12px;}
  .day-tab{
    flex:1;text-align:center;font-family:'Anton';font-weight:400;font-size:15px;
    padding:10px 6px;border:3px solid var(--ink);border-radius:12px;cursor:pointer;
    background:rgba(255,255,255,0.35);color:var(--ink);letter-spacing:0.3px;
  }
  .day-tab.active{background:#FFD23E;box-shadow:3px 3px 0 var(--ink);}

  .panel{
    background:var(--cream);border:3px solid var(--ink);border-radius:16px;
    box-shadow:5px 5px 0 rgba(0,0,0,0.25);padding:13px 14px;margin-bottom:12px;
  }
  .panel-label{
    font-family:'Space Mono', monospace;font-size:11px;text-transform:uppercase;
    letter-spacing:1px;color:#075C57;font-weight:700;margin-bottom:8px;
  }

  .chip-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;}
  .person-chip{
    display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--ink);
    border-radius:999px;padding:5px 11px 5px 5px;cursor:pointer;font-weight:600;font-size:13px;
    -webkit-touch-callout:none;user-select:none;
  }
  .person-chip.me{box-shadow:0 0 0 2px #FF3D7F;}
  .dot{
    width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:9.5px;font-weight:800;border:2px solid var(--ink);flex-shrink:0;
  }
  .add-person-btn{
    display:flex;align-items:center;gap:6px;background:#FF3D7F;color:#fff;border:2px solid var(--ink);
    border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;
  }
  .add-form{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);}
  .add-form input[type=text]{
    padding:9px 11px;border:2px solid var(--ink);border-radius:8px;font-family:'Inter';
    font-size:15px;width:100%;max-width:280px;margin-bottom:9px;
  }
  .swatch-grid{display:flex;flex-wrap:wrap;gap:6px;max-width:340px;margin-bottom:10px;}
  .swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
  .swatch.selected{border-color:var(--ink);box-shadow:0 0 0 2px #FFD23E;}
  .form-actions{display:flex;gap:8px;}
  .save-mini{
    background:var(--ink);color:#fff;border:none;border-radius:8px;padding:9px 16px;
    font-weight:700;cursor:pointer;font-size:13px;
  }
  .cancel-mini{
    background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:8px;
    padding:8px 15px;font-weight:700;cursor:pointer;font-size:13px;
  }

  .filter-row{display:flex;gap:8px;flex-wrap:wrap;}
  .filter-chip{
    font-family:'Space Mono', monospace;font-size:11.5px;border:2px solid var(--ink);
    background:#fff;padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:700;
  }
  .filter-chip.on{background:#075C57;color:#fff;}

  .grid-outer{
    background:#075C57;border:3px solid var(--ink);border-radius:16px;
    box-shadow:5px 5px 0 rgba(0,0,0,0.25);overflow-x:auto;overflow-y:hidden;
  }
  body.day-Saturday .grid-outer{background:#B3401F;}
  body.day-Sunday .grid-outer{background:#2E6A17;}

  .grid-inner{display:flex;min-width:max-content;}
  .time-col{width:32px;flex-shrink:0;position:relative;border-right:2px solid rgba(255,255,255,0.15);padding-top:54px;}
  .time-label{
    position:absolute;left:0;right:0;font-family:'Space Mono', monospace;font-size:9px;
    color:var(--cream);opacity:0.75;padding-left:3px;transform:translateY(-6px);
  }
  .stage-col{width:clamp(74px, calc((100vw - 68px) / 4), 180px);flex-shrink:0;border-right:1px solid rgba(255,255,255,0.12);position:relative;}
  .stage-head{
    height:54px;background:var(--ink);color:#FFD23E;font-family:'Anton';font-weight:400;
    font-size:10.5px;letter-spacing:0.2px;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:3px 4px;position:sticky;top:0;z-index:5;line-height:1.08;overflow:hidden;
  }
  .stage-body{position:relative;}

  .act{
    position:absolute;left:3px;right:3px;background:#FFD23E;border:2px solid var(--ink);
    border-radius:7px;padding:4px 5px 5px;cursor:pointer;overflow:hidden;
    transition:filter 0.1s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    -webkit-touch-callout:none;user-select:none;
  }
  .act:hover{filter:brightness(1.06);}
  .act.dimmed{opacity:0.25;}
  .act.mine{background:#FFE38A;box-shadow:0 0 0 3px #FF3D7F;}
  .act.converge{box-shadow:0 0 0 3px #fff, 0 0 14px 2px rgba(255,255,255,0.85);}
  .act-name{
    font-weight:800;font-size:10px;line-height:1.15;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .act-time{font-family:'Space Mono', monospace;font-size:8px;color:#075C57;font-weight:700;margin-top:2px;}
  .act-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px;}
  .mini-dot{
    width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);
    font-size:6.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
  }
  .converge-badge{position:absolute;top:2px;right:3px;font-size:9px;}
  .empty-note{color:var(--cream);font-family:'Space Mono', monospace;font-size:12px;padding:16px;}

  .footer-hint{
    color:var(--cream);font-family:'Space Mono', monospace;font-size:11px;
    text-align:center;margin-top:14px;opacity:0.85;line-height:1.6;
  }

  /* who's-going modal */
  .modal-bg{
    position:fixed;inset:0;background:rgba(7,20,20,0.65);display:flex;
    align-items:center;justify-content:center;z-index:60;padding:20px;
  }
  .modal{
    background:var(--cream);border:3px solid var(--ink);border-radius:16px;
    max-width:360px;width:100%;max-height:70vh;overflow-y:auto;padding:18px;
    box-shadow:6px 6px 0 rgba(0,0,0,0.35);
  }
  .modal h3{font-family:'Anton';font-weight:400;margin:0 0 10px;color:#075C57;font-size:19px;}
  .who-row{display:flex;align-items:center;gap:9px;padding:6px 0;font-weight:600;font-size:14px;}
  .who-row .dot{width:24px;height:24px;font-size:10px;}
  .modal-close{
    display:block;margin:14px auto 0;background:var(--ink);color:#fff;border:none;
    border-radius:999px;padding:8px 20px;font-weight:700;cursor:pointer;
  }
  .none-yet{font-family:'Space Mono';font-size:12px;color:#556;}

  .loading{color:var(--cream);font-family:'Space Mono';padding:40px;text-align:center;}
  .sync-banner{
    background:#FFD23E;color:#12181A;border:2px solid var(--ink);border-radius:10px;
    padding:9px 13px;font-family:'Space Mono', monospace;font-size:12px;font-weight:700;
    margin-bottom:10px;box-shadow:3px 3px 0 rgba(0,0,0,0.25);
  }
</style>
</head>

function contrastText(hex){
  const c = hex.replace('#','');
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.6 ? '#12181A' : '#FFFFFF';
}

function tp(h,m){ return (h%12)*60 + m; }
function lbl(h1,m1,h2,m2){
  const f=(h,m)=>`${h}:${m.toString().padStart(2,'0')}`;
  return `${f(h1,m1)}–${f(h2,m2)} PM`;
}
const DAY_PREFIX = { Friday:'F', Saturday:'A', Sunday:'U' };
function A(day,stage,name,h1,m1,h2,m2,id){
  return {id: DAY_PREFIX[day]+'-'+id, stage, name, s:tp(h1,m1), e:tp(h2,m2), label: lbl(h1,m1,h2,m2)};

  A('Sunday','duboce','Britton',2,5,2,35,'g1'),
  A('Sunday','duboce','Day We Ran',3,25,3,55,'g2'),
  A('Sunday','duboce','Frost Children DJ Set',4,45,5,30,'g3'),
  A('Sunday','duboce','Marlon Funaki',6,15,6,45,'g4'),
  A('Sunday','duboce','Surprise Guest',7,45,8,45,'g5'),

  A('Sunday','cocktail','Bingo Loco',12,30,1,15,'h1'),
  A('Sunday','cocktail','Bingo Loco',1,40,2,25,'h2'),
  A('Sunday','cocktail','Bingo Loco',2,50,3,35,'h3'),
  A('Sunday','cocktail','Open Mic — Rainbow Girls',4,5,4,50,'h4'),
  A('Sunday','cocktail','Aidan Corcoran',5,15,5,45,'h5'),
  A('Sunday','cocktail','Help Me Lose My Mind: UK Garage & House w/ MPHD',6,0,7,0,'h6'),
]
};

/* ---------- state ---------- */
let people = [];       // [{id, name, color}]
let picks = {};         // {personId: [actId,...]}
let myId = null;
let currentDay = 'Friday';
let filterMode = 'all';
let addFormOpen = false;
let pendingColor = PALETTE[0];
let draftName = '';
let whoModalActId = null;

const app = document.getElementById('app');

/* ---------- firebase realtime database ---------- */
const FB_URL = 'https://foggy-bison-herd-default-rtdb.firebaseio.com'.replace(/\/+$/,'');
const DATA_NODE = '/foggybisonherd-data';
let pendingRemoteData = null;

function idFromHash(){
  const m = location.hash.match(/id=([A-Za-z0-9_]+)/);
  return m ? m[1] : null;
}
function setHashId(id){
  history.replaceState(null, '', '#id=' + id);
}

async function fetchInitial(){
  try{
    const res = await fetch(FB_URL + DATA_NODE + '.json');
    const d = await res.json();
    if(d){ people = d.people||[]; picks = d.picks||{}; }
  }catch(e){ console.error('initial load failed', e); }
}

async function saveData(){
  const payload = {people,picks};
  const ok = await retryPut(payload);
  syncOk = ok;
  if(!ok) scheduleSyncRetry(payload);
  render();
  return ok;
}

// retries a firebase write a few times with backoff; returns true/false
async function retryPut(payload, attempts=3){
  for(let i=0;i<attempts;i++){
    try{
      const res = await fetch(FB_URL + DATA_NODE + '.json', {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
      return true;
    }catch(e){
      console.error('save attempt '+(i+1)+' failed', e);
      if(i < attempts-1) await new Promise(r=>setTimeout(r, 700*(i+1)));
    }
  }
  return false;
}

// if a save still fails after retries, keep trying quietly in the background
let syncOk = true;
let syncRetryTimer = null;
function scheduleSyncRetry(payload){
  if(syncRetryTimer) clearTimeout(syncRetryTimer);
  syncRetryTimer = setTimeout(async ()=>{
    const ok = await retryPut(payload);
    syncOk = ok;
    if(!ok){ scheduleSyncRetry(payload); }
    render();
  }, 5000);
}

// live push updates via Firebase's SSE stream (no polling needed)
let streamRetryDelay = 2000;
function connectStream(){
  let es;
  try{ es = new EventSource(FB_URL + DATA_NODE + '.json'); }
  catch(e){ console.error('live stream unsupported in this browser', e); return; }

  const applyIncoming = (raw)=>{
    let msg;
    try{ msg = JSON.parse(raw); }catch(e){ return; }
    const d = msg.data;
    if(d===null || d===undefined) return; // ignore empty/cleared node rather than wiping the view
    if(addFormOpen){ pendingRemoteData = d; return; } // don't clobber someone mid-typing
    people = d.people||[]; picks = d.picks||{};
    streamRetryDelay = 2000;
    render();
  };

  es.addEventListener('put', (e)=> applyIncoming(e.data));
  es.addEventListener('patch', ()=>{ fetchInitial().then(render); });
  es.onerror = ()=>{
    es.close();
    setTimeout(connectStream, streamRetryDelay);
    streamRetryDelay = Math.min(streamRetryDelay*1.5, 15000);
  };
}

/* ---------- helpers ---------- */
function usedColors(){ return new Set(people.map(p=>p.color)); }
function availableColors(){
  const used = usedColors();
  const free = PALETTE.filter(c=>!used.has(c));
  return free.length ? free : PALETTE;
}
function initialsOf(name){
  const parts = name.trim().split(/\s+/);
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}
function wantersFor(actId){
  return people.filter(p => (picks[p.id]||[]).includes(actId));
}

let colorPickerFor = null;
function toggleColorPicker(id){
  colorPickerFor = (colorPickerFor === id) ? null : id;
  render();
}
async function setPersonColor(id, color){
  const p = people.find(x=>x.id===id);
  if(!p) return;
  p.color = color;
  colorPickerFor = null;
  render();
  saveData();
}

function deletePerson(id){
  const p = people.find(x=>x.id===id);
  if(!p) return;
  const ok = confirm(`Remove ${p.name} and all their picks? This can't be undone.`);
  if(!ok) return;
  people = people.filter(x=>x.id!==id);
  delete picks[id];
  if(myId===id){
    myId = null;
    history.replaceState(null, '', location.pathname + location.search);
  }
  render();
  saveData();
}

function toggleAddForm(){
  addFormOpen = !addFormOpen;
  pendingColor = availableColors()[0] || PALETTE[0];
  draftName = '';
  render();
  focusNameInput();
}
function cancelAddForm(){
  addFormOpen = false; draftName='';
  if(pendingRemoteData){ people = pendingRemoteData.people||[]; picks = pendingRemoteData.picks||{}; pendingRemoteData = null; }
  render();
}
function pickColor(c){
  const el = document.getElementById('new-person-name');
  if(el) draftName = el.value;
  pendingColor = c;
  render();
  focusNameInput();
}
function focusNameInput(){
  if(!addFormOpen) return;
  setTimeout(()=>{
    const el = document.getElementById('new-person-name');
    if(el){ el.focus(); const p = el.value.length; el.setSelectionRange(p,p); }
  }, 20);
}

async function submitAddPerson(){
  const input = document.getElementById('new-person-name');
  const name = (input ? input.value : draftName).trim();
  if(!name) return;
  const id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  people.push({id, name, color: pendingColor});
  picks[id] = [];
  draftName = '';
  myId = id;
  addFormOpen = false;
  pendingRemoteData = null;
  setHashId(id);
  render();       // instant feedback
  saveData();      // background
}

async function toggleWant(actId){
  if(!myId){ toggleAddForm(); return; }
  const set = new Set(picks[myId]||[]);
  if(set.has(actId)) set.delete(actId); else set.add(actId);
  picks[myId] = Array.from(set);
  render();       // instant feedback
  saveData();      // saves + retries in the background, re-renders only if sync status changes
}

function openWhoModal(actId){ whoModalActId = actId; render(); }
function closeWhoModal(){ whoModalActId = null; render(); }

function setDay(day){ currentDay = day; render(); }
function setFilter(mode){ filterMode = mode; render(); }

function dayBounds(day){
  let min=Infinity,max=-Infinity;
  ACTS[day].forEach(a=>{ if(a.s<min)min=a.s; if(a.e>max)max=a.e; });
  if(!isFinite(min)){min=0;max=600;}
  min = Math.floor(min/60)*60; max = Math.ceil(max/60)*60;
  return {min,max};
}

/* ---------- long-press handling ---------- */
let pressTimer = null;
let pressFired = false;
function bindPress(el, onTap, onHold){
  const start = (e)=>{
    pressFired = false;
    pressTimer = setTimeout(()=>{ pressFired = true; onHold(); }, 480);
  };
  const clear = ()=>{ if(pressTimer) clearTimeout(pressTimer); };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', clear);
  el.addEventListener('pointerleave', clear);
  el.addEventListener('pointercancel', clear);
  el.addEventListener('click', (e)=>{
    if(pressFired){ e.preventDefault(); pressFired=false; return; }
    onTap();
  });
  el.addEventListener('contextmenu', (e)=>{ e.preventDefault(); onHold(); });
}

/* ---------- render ---------- */
function render(){
  document.body.className = 'day-' + currentDay;
  const {min,max} = dayBounds(currentDay);
  const PX_PER_MIN = 1.35;
  const totalHeight = (max-min)*PX_PER_MIN + 20;

  let html = '';
  if(!syncOk){
    html += `<div class="sync-banner">⚠ Couldn't sync your last change — retrying in the background. Keep this page open.</div>`;
  }
  html += `<div class="header">
    <div class="title-block">
      <h1>FOGGY BISON HERD</h1>
      <div class="sub">Outside Lands 2026 · shared with your crew</div>
    </div>
  </div>`;

  html += `<div class="day-tabs">`;
  ['Friday','Saturday','Sunday'].forEach(d=>{
    html += `<div class="day-tab ${d===currentDay?'active':''}" onclick="setDay('${d}')">${d.toUpperCase()}</div>`;
  });
  html += `</div>`;

  // identity / key panel
  html += `<div class="panel">
    <div class="panel-label">Who's here (${people.length})</div>
    <div class="chip-row">`;
  people.forEach(p=>{
    const txt = contrastText(p.color);
    html += `<div class="person-chip ${p.id===myId?'me':''}" id="chip-${p.id}">
      <span class="dot" style="background:${p.color};color:${txt}">${initialsOf(p.name)}</span>
      <span>${escapeHtml(p.name)}</span>
    </div>`;
  });
  html += `<div class="add-person-btn" onclick="toggleAddForm()">+ add yourself</div>
    </div>`;
  if(addFormOpen){
    html += `<div class="add-form">
      <input type="text" id="new-person-name" placeholder="Your full name (e.g. Ranger Dave)" value="${escapeHtml(draftName)}" oninput="draftName=this.value;" onkeydown="if(event.key==='Enter')submitAddPerson();" />
      <div class="swatch-grid">`;
    PALETTE.forEach(c=>{
      html += `<div class="swatch ${c===pendingColor?'selected':''}" style="background:${c}" onclick="pickColor('${c}');"></div>`;
    });
    html += `</div>
      <div class="form-actions">
        <button class="save-mini" onclick="submitAddPerson()">Save & join</button>
        <button class="cancel-mini" onclick="cancelAddForm()">Cancel</button>
      </div>
    </div>`;
  }
  if(colorPickerFor){
    const cp = people.find(x=>x.id===colorPickerFor);
    if(cp){
      html += `<div class="add-form">
        <div style="font-weight:700;font-size:13px;margin-bottom:8px;">Change color for ${escapeHtml(cp.name)}</div>
        <div class="swatch-grid">`;
      PALETTE.forEach(c=>{
        html += `<div class="swatch ${c===cp.color?'selected':''}" style="background:${c}" onclick="setPersonColor('${cp.id}','${c}')"></div>`;
      });
      html += `</div>
        <button class="cancel-mini" onclick="colorPickerFor=null;render();">Close</button>
      </div>`;
    }
  }
  html += `<div style="font-family:'Space Mono',monospace;font-size:10.5px;color:#075C57;margin-top:8px;opacity:0.8;">Tap a name to change their color • Press &amp; hold to remove</div>`;
  html += `</div>`;

  // filter bar
  html += `<div class="panel">
    <div class="panel-label">View</div>
    <div class="filter-row">
      <div class="filter-chip ${filterMode==='all'?'on':''}" onclick="setFilter('all')">Everyone</div>
      <div class="filter-chip ${filterMode==='mine'?'on':''}" onclick="setFilter('mine')">My picks only</div>
      <div class="filter-chip ${filterMode==='popular'?'on':''}" onclick="setFilter('popular')">🔥 Popular (3+)</div>
    </div>
  </div>`;

  // grid
  html += `<div class="grid-outer"><div class="grid-inner">`;
  html += `<div class="time-col" style="height:${totalHeight+54}px;">`;
  for(let t=min; t<=max; t+=60){
    const top = 54 + (t-min)*PX_PER_MIN;
    const hr = Math.floor(t/60);
    const label12 = hr===0?'12PM':(hr+':00');
    html += `<div class="time-label" style="top:${top}px">${label12}</div>`;
  }
  html += `</div>`;

  STAGES[currentDay].forEach(([sid,sname])=>{
    const acts = ACTS[currentDay].filter(a=>a.stage===sid);
    html += `<div class="stage-col">
      <div class="stage-head">${escapeHtml(sname)}</div>
      <div class="stage-body" style="height:${totalHeight}px;">`;
    acts.forEach(act=>{
      const top = (act.s-min)*PX_PER_MIN;
      const h = Math.max((act.e-act.s)*PX_PER_MIN, 64);
      const wanters = wantersFor(act.id);
      const iAmIn = myId && wanters.some(w=>w.id===myId);
      const converge = wanters.length>=3;
      let cls = 'act';
      if(iAmIn) cls += ' mine';
      if(converge) cls += ' converge';
      if(filterMode==='mine' && !iAmIn) cls += ' dimmed';
      if(filterMode==='popular' && wanters.length<3) cls += ' dimmed';
      html += `<div class="${cls}" id="act-${act.id}" style="top:${top}px;height:${h}px;">
        ${converge?'<span class="converge-badge">🔥</span>':''}
        <div class="act-name">${escapeHtml(act.name)}</div>
        <div class="act-time">${escapeHtml(act.label)}</div>
        <div class="act-dots">${wanters.map(w=>{const t=contrastText(w.color);return `<span class="mini-dot" style="background:${w.color};color:${t}">${initialsOf(w.name)}</span>`;}).join('')}</div>
      </div>`;
    });
    if(acts.length===0) html += `<div class="empty-note">no acts yet</div>`;
    html += `</div></div>`;
  });
  html += `</div></div>`;

  html += `<div class="footer-hint">Tap a band to mark it • Press &amp; hold (or right-click) to see who's going</div>`;

  if(whoModalActId){
    const act = ACTS[currentDay].find(a=>a.id===whoModalActId) || Object.values(ACTS).flat().find(a=>a.id===whoModalActId);
    const wanters = wantersFor(whoModalActId);
    html += `<div class="modal-bg" onclick="if(event.target===this) closeWhoModal()">
      <div class="modal">
        <h3>${act?escapeHtml(act.name):''}</h3>
        ${wanters.length? wanters.map(w=>{const t=contrastText(w.color);return `<div class="who-row"><span class="dot" style="background:${w.color};color:${t}">${initialsOf(w.name)}</span>${escapeHtml(w.name)}</div>`;}).join('') : '<div class="none-yet">Nobody has picked this yet.</div>'}
        <button class="modal-close" onclick="closeWhoModal()">Close</button>
      </div>
    </div>`;
  }

  app.innerHTML = html;

  // bind press handlers after DOM is in place
  STAGES[currentDay].forEach(([sid])=>{
    ACTS[currentDay].filter(a=>a.stage===sid).forEach(act=>{
      const el = document.getElementById('act-'+act.id);
      if(el) bindPress(el, ()=>toggleWant(act.id), ()=>openWhoModal(act.id));
    });
  });
  people.forEach(p=>{
    const el = document.getElementById('chip-'+p.id);
    if(el) bindPress(el, ()=>toggleColorPicker(p.id), ()=>deletePerson(p.id));
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function init(){
  await fetchInitial();
  myId = idFromHash();
  if(myId && !people.some(p=>p.id===myId)) myId = null; // stale/unknown id, start fresh
  render();
  connectStream();
}
init();
</script>
